<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | My Web Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="Shortcut Icon"href="Logo.png" type="image/x-icon">
    <style>
        .auth-card { max-width: 28rem; margin: 0 auto 1.5rem; display: grid; gap: 1rem; }
        .show-pw { display: flex; align-items: center; gap: .5rem; font-weight: 400; }
        .msg.ok { background: #e7f6ee; color: #14683f; border-color: #a8dcc2; }
        .auth-card .actions { margin-top: 0; }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="inner">
            <a class="logo" href="index.html">PorBhai</a>
            <nav aria-label="Main">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="form.html">Form</a></li>
                    <li><a href="list.html">People</a></li>
                    <li><a href="Class.html">Class</a></li>
                    <li><a href="login.html">Login</a></li>
                    <li><a class="active" href="signup.html" aria-current="page">Sign Up</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <h1 class="page-title">Create an Account</h1>

        <form class="card auth-card" id="signupForm" novalidate>
            <div class="field">
                <label for="fullName">Full name</label>
                <input type="text" id="fullName" autocomplete="name" placeholder="Enter your full name">
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" autocomplete="email" placeholder="Enter your email">
            </div>
            <div class="field">
                <label for="password">Password (at least 8 characters)</label>
                <input type="password" id="password" data-pw autocomplete="new-password" placeholder="Create a password">
            </div>
            <div class="field">
                <label for="confirm">Confirm password</label>
                <input type="password" id="confirm" data-pw autocomplete="new-password" placeholder="Type the password again">
            </div>
            <label class="show-pw"><input type="checkbox" id="showPw"> Show passwords</label>

            <p id="authMsg" class="msg" role="alert" hidden></p>
            <div class="actions">
                <input type="submit" value="Sign Up">
            </div>
            <p>Already have an account? <a href="login.html">Log in</a></p>
        </form>
    </main>

    <footer>&copy; PorBhai</footer>
    <script src="auth.js"></script>
</body>
</html>
