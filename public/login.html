<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PorBhai</title>
    <link rel="stylesheet" href="style.css">
    <link rel="Shortcut Icon"href="Logo.png" type="image/x-icon">
    <style>
        .auth-card { max-width: 28rem; margin: 0 auto 1.5rem; display: grid; gap: 1rem; }
        .show-pw { display: flex; align-items: center; gap: .5rem; font-weight: 400; }
        .msg.ok { background: #e7f6ee; color: #14683f; border-color: #a8dcc2; }
        .auth-card .actions { margin-top: 0; }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="inner">
            <a class="logo" href="index.html">My Web Page</a>
            <nav aria-label="Main">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="form.html">Form</a></li>
                    <li><a href="list.html">People</a></li>
                    <li><a href="Class.html">Class</a></li>
                    <li><a class="active" href="login.html" aria-current="page">Login</a></li>
                    <li><a href="signup.html">Sign Up</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <h1 class="page-title">Welcome To PorBHai</h1>

        <form class="card auth-card" id="loginForm" novalidate>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" autocomplete="email" placeholder="Enter your email">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" data-pw autocomplete="current-password" placeholder="Enter your password">
            </div>
            <label class="show-pw"><input type="checkbox" id="showPw"> Show password</label>

            <p id="authMsg" class="msg" role="alert" hidden></p>
            <div class="actions">
                <input type="submit" value="Log In">
            </div>
            <p>New here? <a href="signup.html">Create an account</a></p>
        </form>
    </main>

    <footer>&copy; PorBhai</footer>
    <script src="auth.js"></script>
</body>
</html>
