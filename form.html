    <main>
        <h1 class="page-title">Registration Form</h1>

        <form class="card" id="regForm" novalidate>
            <div class="form-grid">
                <div class="field">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter Your Name">
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter Your Email">
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter Your Password" required>
                </div>
                <div class="field">
                    <label for="mark">Class</label>
                    <input type="number" id="mark" name="mark" placeholder="Enter Your Class" min="1" max="12">
                </div>

                <fieldset>
                    <legend>Gender</legend>
                    <div class="choices">
                        <label><input type="radio" id="male" name="gender" value="male"> Male</label>
                        <label><input type="radio" id="female" name="gender" value="female"> Female</label>
                    </div>
                </fieldset>

                <div class="field">
                    <label for="country">Country</label>
                    <select id="country" name="country">
                        <option value="bangladesh">Bangladesh</option>
                        <option value="india">India</option>
                        <option value="pakistan">Pakistan</option>
                        <option value="nepal">Nepal</option>
                        <option value="bhutan">Bhutan</option> 
                        <option value="srilanka">Sri Lanka</option>
                        <optgroup label="Other Countries">
                            <option value="usa">USA</option>
                            <option value="uk">UK</option>
                            <option value="canada">Canada</option>
                        </optgroup>
                    </select>
                </div>
                <div class="field">
                    <label for="dateofbirth">Date of Birth</label>
                    <input type="date" id="dateofbirth" name="dateofbirth">
                </div>
                <div class="field">
                    <label for="Range">Rate Your Skills</label>
                    <input type="range" id="Range" name="Range" min="0" max="12">
                </div>
                <div class="field">
                    <label for="file">Upload Your Picture</Picture></label>
                    <input type="file" id="file" name="file">
                </div>

                <fieldset class="full">
                    <legend>Properties</legend>
                    <div class="choices">
                        <label><input type="checkbox" id="property1" name="Laptop" value="Laptop"> Laptop</label>
                        <label><input type="checkbox" id="property2" name="Mobile" value="Mobile"> Mobile</label>
                        <label><input type="checkbox" id="property3" name="Tablet" value="Tablet"> Tablet</label>
                        <label><input type="checkbox" id="property4" name="Desktop" value="Desktop"> Desktop</label>
                    </div>
                </fieldset>

                <div class="field full">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Enter Your Message"></textarea>
                </div>

                <div class="field full choices">
                    <label><input type="checkbox" id="subscribe" name="subscribe"> I have added all information</label>
                </div>
            </div>

            <p id="formMsg" class="msg" role="alert" hidden></p>
            <div class="actions">
                <input type="reset" value="Reset">
                <input type="submit" value="Submit">
            </div>
        </form>
    </main>

    <footer>&copy; PorBhai</footer>
    <script src="app.js"></script>
</body>
